name: Bug report
description: Something in FeverDreams isn't working the way the docs say it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the sections
        below — missing info is the #1 reason bug reports get closed without a fix.

  - type: input
    id: version
    attributes:
      label: FeverDreams version
      description: Output of `feverdreams --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-os
    attributes:
      label: Node.js version & OS
      description: e.g. `Node 22.10.0 on macOS 15.1`
      placeholder: "Node X.Y.Z on macOS / Linux"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command you ran
      description: The full command line that produced the bug.
      placeholder: "feverdreams workspace create ws1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Paste the exact output, including any stack trace.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction, ideally starting from `feverdreams init` in an empty directory.
      value: |
        1. `...`
        2. `...`
        3. `...`
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Workarounds you've tried, related issues, screenshots, etc.

name: Feature request
description: Propose a new command, flag, or behavior for FeverDreams.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new feature. For questions or
        brainstorming first, open a Discussion — this template is for ideas
        you're ready to describe concretely.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What workflow is painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the new command, flag, or behavior. Show example invocations if possible.
      value: |
        ```bash
        feverdreams ...
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why this one is better.

  - type: textarea
    id: scope
    attributes:
      label: Out of scope / non-goals
      description: What should this feature explicitly NOT do? Anything that would push it past the "Scope" section in the README belongs here.

  - type: input
    id: willingness
    attributes:
      label: Are you willing to open a PR?
      description: "Yes / No / I'd like help."
      placeholder: "Yes"
